[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investor"
version = "0.1.0"
description = "Daily investor research agent"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "yfinance",
    "pandas",
    "requests",
    "lxml",
    "html5lib",
    "ta",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
